function myTax(){
var income1=Number(window.prompt("Enter the first person's salary"));
var income2=Number(window.prompt("Enter the second person's salary"));
var person = Number(window.prompt("How many person"));
var basicAllow = Number(window.prompt("Enter the basic allowance per person"));
var allowance=Number(window.prompt("Enter the rest of allowance"));
var mpf1 = income1*0.05;
if (mpf1 >= 1500){mpf1 = 1500;}
var mpf2 = income2*0.05;
if (mpf2 >= 1500){mpf2 = 1500;}
var sum = Number((income1+income2)*12-(basicAllow*person+allowance)-(mpf1+mpf2)*12);
var times = Math.floor(sum/50000);
if (times>=4){times = 4;}

var txt=0;
switch(times){
case 0:
txt = sum*0.02;
break;
case 1:
txt = 50000*0.02+(sum-50000)*0.06;
break;
case 2:
txt = 50000*0.02+50000*0.06+(sum-100000)*0.1;
break;
case 3:
txt = 50000*0.02+50000*0.06+50000*0.1+(sum-150000)*0.15;
break;
case 4:
txt = 50000*0.02+50000*0.06+50000*0.1+50000*0.15+(sum-200000)*0.17;
break;
if ((income1+income2)*12-(mpf1+mpf2)*12<=allowance*person){
txt = 0;}
}

document.write(`The yearly tax for ${person} person is <b>${txt}</b>`);
/*document.write(txt+" "+income1+" "+income2+" " + allowance + " " + sum + " "+ times+" "+person+" "+basicAllow);*/
}

function myExchange(){

var jcb = Number(window.prompt("Enter the JCB exchange rate today"));
var master = Number(window.prompt("Enter the Master exchange rate today"));
/*var handFee = Number(window.prompt("Enter the handling fee in percentage"));*/
var cTotal = amount*fxHk;
var vTotal = amount*visa*(1+vHand);
var mTotal = amount*master*(1+mHand);
var jTotal = amount*jcb*(1+jHand);
var upTotal = amount*up*(1+upHand);

document.write(`The exchange amount in cash for HK dollar is <b>$ ${cTotal.toFixed(2)} </b><br>
The Union Pay exchange amount in HK dollar is <b>$ ${upTotal.toFixed(2)}</b> <br>

The Master exchange amount in HK dollar is <b>$ ${mTotal.toFixed(2)} </b>`);
}
